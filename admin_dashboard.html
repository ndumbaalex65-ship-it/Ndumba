{% extends "base.html" %}
{% block content %}
<h2>Admin Dashboard</h2>
<a href="{{ url_for('register') }}" class="btn btn-primary">Create New User</a>
<h3 class="mt-4">Users</h3>
<table class="table">
    <thead>
        <tr><th>Username</th><th>Role</th><th>Email</th></tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr><td>{{ user.username }}</td><td>{{ user.role }}</td><td>{{ user.email or 'N/A' }}</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h2>Search Pupils</h2>
<form method="GET" class="mb-4">
    <div class="input-group">
        <input type="text" name="q" value="{{ query }}" class="form-control" placeholder="Name, ID, or Class">
        <button type="submit" class="btn btn-primary">Search</button>
    </div>
</form>
{% if pupils %}
<table class="table">
    <thead>
        <tr><th>Name</th><th>ID</th><th>Class</th><th>Action</th></tr>
    </thead>
    <tbody>
        {% for p in pupils %}
        <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.pupil_id }}</td>
            <td>{{ p.class_name }}</td>
            <td><a href="{{ url_for('generate_report', pupil_id=p.id) }}" class="btn btn-sm btn-success">PDF Report</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No pupils found.</p>
{% endif %}
{% endblock %}

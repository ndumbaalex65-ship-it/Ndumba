{% extends "base.html" %}
{% block content %}
<h2>Enter Pupil Results</h2>
<form method="POST">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label>Pupil</label>
            <select name="pupil_id" class="form-control" required>
                {% for p in pupils %}
                <option value="{{ p.id }}">{{ p.name }} ({{ p.pupil_id }}) - {{ p.class_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label>Subject</label>
            <select name="subject_id" class="form-control" required>
                {% for s in subjects %}
                <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label>Continuous Assessment</label>
            <input type="number" name="ca" class="form-control" step="0.1" required>
        </div>
        <div class="col-md-4 mb-3">
            <label>Exam Score</label>
            <input type="number" name="exam" class="form-control" step="0.1" required>
        </div>
        <div class="col-md-4 mb-3">
            <label>Term</label>
            <input type="text" name="term" class="form-control" placeholder="e.g. Term 1" required>
        </div>
    </div>
    <div class="mb-3">
        <label>Year</label>
        <input type="text" name="year" class="form-control" value="2025" required>
    </div>
    <div class="mb-3">
        <label>Teacher Comment</label>
        <textarea name="comment" class="form-control"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save Results</button>
</form>
{% endblock %}
